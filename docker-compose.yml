services:
  mysql:
    image: mysql:8.0
    container_name: support-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: support
    ports:
      - "3306:3306"
    volumes:
      - support-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  support-mysql-data:
