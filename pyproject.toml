[project]
name = "ecommerce-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncmy>=0.2.9",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "pymilvus[milvus-lite]>=3.0.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# DBテストではセッション全体で使い回すengine(_test_engine, scope="session")を
# 複数のfixture/テストがまたいで利用するため、fixtureのloop scopeはsessionに揃える。
# 揃えないとasyncmyのコネクションが異なるイベントループに紐付き、
# "Future attached to a different loop" のRuntimeErrorになる。
# テスト側のデフォルトloop scopeはあえて上げない(=function のまま): これを session に
# すると、DB と無関係な非同期テストまで含めて全テストが1つのイベントループを共有してしまい、
# あるテストが残したタスクが後続テストに漏れる温床になる(Task 9のタイムアウト/リトライや
# バックグラウンドタスクで特に問題になる)。DBに触れるテストモジュールだけ、そのモジュール内で
# `pytestmark = pytest.mark.asyncio(loop_scope="session")` を明示すること
# (tests/test_db_conn.py 参照)。
asyncio_default_fixture_loop_scope = "session"
