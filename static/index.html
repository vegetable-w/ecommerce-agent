<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STORE カスタマーサポート</title>
<style>
  /* 配色は中立のグレーに 1 色のアクセント。読ませたいのは会話の中身なので、
     地の色で目を引かない。自分の発話と相手の発話は色の濃淡ではっきり分ける。 */
  :root{
    --page:#f6f7f9;
    --surface:#ffffff;
    --ink:#1c2024;
    --ink-2:#3f4650;
    --muted:#6b7480;
    --line:#e3e6ea;
    --line-2:#eef0f3;
    --accent:#2563eb;
    --accent-d:#1d4ed8;
    --accent-soft:#eff4ff;
    --me:#2563eb; --me-ink:#ffffff;      /* 自分の発話は塗り。誰の発話かを一目で分ける */
    --bot:#ffffff;
    --ok:#0f9960; --warn:#b45309; --bad:#c0392b;
    --bad-bg:#fdeceb;
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font-size:15px; line-height:1.7;
    font-family:-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans",
                "Noto Sans JP",system-ui,sans-serif;
    background:var(--page);
    display:flex; align-items:center; justify-content:center; padding:20px;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:min(720px,100%); height:min(880px,calc(100vh - 40px));
    display:flex; flex-direction:column;
    background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }

  /* 会話の切り替え欄(07 章の受け入れ検証用)。
     **.app を横 flex にしない。** あちらは header / .log / footer を縦に積んでおり、
     向きを変えるとチャット画面がそのまま崩れる。外側に .shell を 1 枚足して、
     一覧と .app を横に並べる。.app 側の指定には一切手を触れていない。 */
  .shell{display:flex; gap:14px; align-items:stretch; max-width:100%}
  #sidebar{
    width:240px; flex:none; display:flex; flex-direction:column;
    height:min(880px,calc(100vh - 40px));
    background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  /* 狭い画面では畳む。並べたままだと吹き出しの幅が読めないほど痩せる */
  @media (max-width:780px){ #sidebar{display:none} }
  #sidebar .sbhead{
    display:flex; align-items:center; gap:6px;
    padding:15px 16px; font-size:13px; font-weight:600;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  #sidebar .sbhead span{font-weight:400; font-size:11.5px; color:var(--muted)}
  .sblist{flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px}
  .sblist::-webkit-scrollbar{width:8px}
  .sblist::-webkit-scrollbar-thumb{background:#d5dae0; border-radius:99px}
  .sbempty{font-size:12px; color:var(--muted); text-align:center; padding:16px 8px; line-height:1.7}

  /* 1 件ぶんのカード。注文カード(.order-card)と同じピンクの語彙で、
     いま開いている会話だけ薄くせずに残す。 */
  .conv{
    display:flex; flex-direction:column; gap:4px; width:100%; text-align:left;
    font:inherit; line-height:1.5; cursor:pointer; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 12px; transition:transform .1s, background .15s, border-color .15s;
  }
  .conv:hover{background:var(--page); border-color:var(--line)}
  .conv:active{transform:translateY(1px)}
  .conv.on{background:var(--accent-soft); border-color:var(--accent)}
  .conv .top{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted)}
  .conv .sum{
    margin-left:auto; font-size:10.5px; line-height:1.5; color:var(--accent-d);
    background:var(--accent-soft); border:1px solid var(--line); border-radius:999px; padding:1px 8px;
  }
  /* 2 行で打ち切る。長い最初の質問で一覧が埋まると、どの会話か探せなくなる */
  .conv .pv{
    font-size:13px; word-break:break-word; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .conv .pv.none{color:var(--muted)}
  .conv .foot{font-size:11px; color:var(--muted)}

  header{
    display:flex; align-items:center; gap:11px;
    padding:13px 18px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  /* 動かさない。会話を読んでいる間ずっと視界の端で動くものがあると気が散る */
  .face{
    width:34px; height:34px; border-radius:var(--radius-sm); flex:none;
    display:grid; place-items:center; font-size:14px; font-weight:700;
    color:#fff; background:var(--ink);
  }
  .who{display:flex; flex-direction:column; line-height:1.25}
  .who b{font-size:14.5px; font-weight:600}
  .who span{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .adminlink,.reset{
    text-decoration:none; font:inherit; font-size:12.5px; cursor:pointer;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--line); padding:6px 11px; border-radius:var(--radius-sm);
    transition:background .12s, color .12s;
  }
  .adminlink{margin-left:auto}
  .adminlink:hover,.reset:hover{background:var(--page); color:var(--ink)}

  .log{flex:1; overflow-y:auto; padding:22px 20px 10px; display:flex; flex-direction:column; gap:16px;
       background:var(--page)}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:#d5dae0; border-radius:99px}

  /* 出現は軽いフェードだけ。拡大縮小を混ぜると文字が一瞬滲む */
  .row{display:flex; gap:10px; align-items:flex-end; animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  .row.me{flex-direction:row-reverse}

  /* 客服側は emoji の猫、ユーザー側だけインライン SVG(emoji の顔文字は環境により硬く見えるため)。 */
  .av{width:28px;height:28px;border-radius:var(--radius-sm);flex:none;display:grid;place-items:center;
      font-size:13px; font-weight:700; color:#fff; background:var(--ink-2)}
  .row.me .av{background:var(--accent)}
  .row.me .av svg{width:15px;height:15px;fill:#fff}

  .bub{
    max-width:78%; padding:11px 15px; border-radius:var(--radius); font-size:15px; line-height:1.75;
    white-space:pre-wrap; word-break:break-word;
  }
  .row.bot .bub{background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px}
  /* 自分の発話は塗り。淡い色どうしだと、どちらが自分か毎回読んで確かめることになる */
  .row.me  .bub{background:var(--me); color:var(--me-ink); border-bottom-right-radius:4px}
  .row.err .bub{background:var(--bad-bg); border:1px solid #f5cdc9; color:var(--bad); font-size:13.5px}

  .caret{display:inline-block;width:2px;height:1em;vertical-align:-2px;margin-left:1px;
         background:var(--accent); animation:blink .9s steps(1) infinite}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  .think{display:flex; gap:4px; padding:4px 2px}
  .think i{width:6px;height:6px;border-radius:50%;background:#b9c0c9;display:block;animation:jump 1.1s infinite}
  .think i:nth-child(2){animation-delay:.15s}
  .think i:nth-child(3){animation-delay:.3s}
  @keyframes jump{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-6px);opacity:1}}

  .hint{align-self:center; font-size:12px; color:var(--muted); background:var(--surface);
        border:1px solid var(--line); padding:5px 13px; border-radius:999px}

  footer{padding:14px 16px 16px; background:var(--surface); border-top:1px solid var(--line)}
  .bar{display:flex; gap:10px; align-items:flex-end;
       background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
       padding:8px 8px 8px 14px;
       transition:border-color .12s, box-shadow .12s}
  .bar:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{
    flex:1; border:none; outline:none; resize:none; font:inherit; font-size:15px; line-height:1.6;
    max-height:120px; background:transparent; color:var(--ink); padding:4px 0;
  }
  textarea::placeholder{color:#9aa3ae}
  .send{
    width:38px;height:38px;flex:none;border:none;border-radius:var(--radius-sm);cursor:pointer;
    background:var(--accent); color:#fff; font-size:16px;
    transition:background .12s;
  }
  .send:hover:not(:disabled){background:var(--accent-d)}
  .send:disabled{opacity:.35; cursor:not-allowed}
  .tip{text-align:center; font-size:11px; color:var(--muted); margin:8px 0 0}

  /* 引用。本文中の [n] を上付きの押せる印にする */
  .cite{
    display:inline-block; cursor:pointer; font-size:10.5px; line-height:1;
    vertical-align:super; margin:0 1px; padding:2px 5px; border-radius:5px;
    color:var(--accent-d); background:var(--accent-soft); border:1px solid #cfe0ff;
    transition:background .12s;
  }
  .cite:hover{background:var(--accent-soft)}
  .cite:active{transform:translateY(1px)}

  /* 出典パネル。吹き出しの下にそのまま開く(別ウィンドウにしない) */
  .src{
    margin-top:9px; border:1px solid var(--line); border-radius:14px;
    background:#fafbfc; padding:10px 13px; animation:pop .18s ease-out;
  }
  .src .head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .src .path{font-size:11px; color:var(--muted); flex:1; word-break:break-word}
  .src .close{
    border:none; background:none; cursor:pointer; font:inherit; font-size:15px;
    color:var(--muted); line-height:1; padding:2px 4px;
  }
  .src .close:hover{color:var(--accent-d)}
  .src .q{font-size:13px; font-weight:600; margin-bottom:4px}
  .src .a{font-size:12.5px; line-height:1.75; color:var(--ink-2); white-space:pre-wrap; word-break:break-word}

  /* 満足度。押せるのは 1 回だけ */
  .fb{display:flex; align-items:center; gap:7px; margin-top:9px}
  .fb button{
    font:inherit; font-size:13px; cursor:pointer; line-height:1;
    border:1px solid var(--line); background:#fff; padding:5px 11px; border-radius:999px;
    transition:transform .1s, opacity .15s;
  }
  .fb button:hover:not(:disabled){border-color:var(--accent)}
  .fb button:active:not(:disabled){transform:translateY(1px)}
  .fb button:disabled{cursor:default}
  .fb button.active{border-color:transparent; color:#fff;
                    background:linear-gradient(160deg,var(--accent),var(--accent-d));
                    box-shadow:0 3px 9px rgba(37,99,235,.22)}
  .fb button.dim{opacity:.35}
  .fb .thanks{font-size:11.5px; color:var(--muted)}

  /* 選択肢ボタン。苦情のとき backend が返してきた「有人対応 / チケット作成」を
     吹き出しの下に並べる。押した後は .fb と同じく薄くして押せないことを示す。 */
  .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .act{
    font:inherit; font-size:13px; cursor:pointer; line-height:1;
    border:1px solid var(--line); background:var(--accent-soft); color:var(--accent-d);
    padding:8px 14px; border-radius:999px;
    transition:transform .1s, background .15s, opacity .15s;
  }
  .act:hover:not(:disabled){background:var(--accent-soft)}
  .act:active:not(:disabled){transform:translateY(1px)}
  .act:disabled{cursor:default; opacity:.45; background:#fff; color:var(--muted); border-color:var(--line)}

  /* チケット作成フォーム。外部ライブラリは入れず、自前で画面に重ねる。 */
  .mask{
    position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:16px;
    background:rgba(61,53,80,.3); backdrop-filter:blur(2px); animation:pop .18s ease-out;
  }
  .sheet{
    width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 20px 16px; box-shadow:0 24px 60px rgba(16,20,26,.40);
  }
  .sheet h3{margin:0 0 4px; font-size:16px}
  .sheet .lead{margin:0 0 14px; font-size:12px; color:var(--muted)}
  .field{display:block; margin-bottom:12px}
  .field .cap{display:block; font-size:12.5px; margin-bottom:5px}
  .field .cap i{font-style:normal; font-size:11px; color:var(--accent-d); margin-left:5px}
  /* 素の textarea 規則(入力欄用)を打ち消す。あちらは枠なしの行内入力の想定。 */
  .sheet input,.sheet select,.sheet textarea{
    width:100%; font:inherit; font-size:14px; color:var(--ink); flex:none;
    background:#fafbfc; border:1.5px solid var(--line); border-radius:14px;
    padding:9px 12px; outline:none; transition:border-color .15s;
  }
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent)}
  /* 返金申請の注文番号。backend が特定済みなので入力させない(見えてはいる) */
  .sheet input[readonly]{background:#f7f3f8; color:var(--muted); cursor:default; border-color:var(--line)}
  .sheet input[readonly]:focus{border-color:var(--line)}
  .sheet textarea{resize:vertical; min-height:88px; max-height:220px; line-height:1.7}
  /* 高さを固定しておく。出た瞬間にボタンが下へずれると押し間違える。 */
  .sheet .warn{min-height:17px; margin:0 0 10px; font-size:12px; color:var(--bad)}
  .sheet .btns{display:flex; justify-content:flex-end; gap:9px}
  .sheet .btns button{
    font:inherit; font-size:13.5px; cursor:pointer; border-radius:999px; padding:9px 18px;
    transition:transform .1s, opacity .15s;
  }
  .sheet .btns button:active:not(:disabled){transform:translateY(1px)}
  .sheet .btns .ghost{background:#fff; border:1px solid var(--line); color:var(--muted)}
  .sheet .btns .ghost:hover{border-color:var(--accent); color:var(--accent-d)}
  .sheet .btns .go{
    border:none; color:#fff; background:linear-gradient(160deg,var(--accent),var(--accent-d));
    box-shadow:0 4px 12px rgba(37,99,235,.24);
  }
  .sheet .btns button:disabled{opacity:.5; cursor:not-allowed; box-shadow:none; transform:none}

  /* 注文の選択カード。注文番号が分からないとき、model に推測させず
     ここから選んでもらう(spec §12)。押せるのは 1 回だけで、押した後は全部を無効にする。
     .act と同じピンクの語彙で、1 件ぶんの情報が入るぶんだけ角丸を大きくしている。 */
  .orders{display:flex; flex-direction:column; gap:8px; margin-top:10px}
  .order-card{
    display:flex; flex-direction:column; gap:3px; width:100%; text-align:left;
    font:inherit; line-height:1.5; cursor:pointer; color:var(--ink);
    border:1px solid var(--line); background:var(--page); padding:10px 13px; border-radius:var(--radius);
    transition:transform .1s, background .15s, border-color .15s, opacity .15s;
    animation:pop .2s ease-out;
  }
  .order-card:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent)}
  .order-card:active:not(:disabled){transform:translateY(1px)}
  .order-card:disabled{cursor:default; opacity:.42; background:#fff; border-color:var(--line)}
  .order-card .no{font-size:11.5px; color:var(--muted)}
  .order-card .pd{font-size:14px; font-weight:600}
  .order-card .meta{display:flex; align-items:center; gap:8px; font-size:12.5px; margin-top:2px}
  .order-card .st{border:1px solid var(--line); background:#fff; color:var(--muted);
                  border-radius:999px; padding:2px 9px; line-height:1.5}
  .order-card .amt{color:var(--accent-d); font-weight:600}
  /* 選んだ 1 枚だけは薄くしない。どれを選んだのか後から読み取れるようにする */
  .order-card.picked:disabled{opacity:1; color:var(--ink);
                              background:var(--accent-soft); border-color:var(--accent)}
  .order-card.picked .no::after{content:"（選択済み）"; color:var(--accent-d)}

  /* チケット内容の確認カード。注文カードと同じピンクの語彙で、送信前に必ず一度出る。
     ここを押すまで backend は書き込まない(権限は engine 側の闸で止まっている)。 */
  .confirm{
    margin-top:10px; border:1px solid var(--line); background:var(--page);
    border-radius:var(--radius); padding:12px 14px; animation:pop .2s ease-out;
  }
  .confirm h4{margin:0 0 8px; font-size:13px; font-weight:600}
  .confirm dl{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:0 0 11px}
  .confirm dt{font-size:11.5px; color:var(--muted); white-space:nowrap}
  .confirm dd{margin:0; font-size:13.5px; word-break:break-word}
  .confirm .btns{display:flex; gap:8px}
  .confirm button{
    font:inherit; font-size:13px; cursor:pointer; border-radius:999px;
    padding:7px 16px; transition:transform .1s, background .15s, border-color .15s, opacity .15s;
  }
  .confirm button:active:not(:disabled){transform:translateY(1px)}
  .confirm button:disabled{cursor:default; opacity:.42}
  .confirm .ok{border:1px solid var(--accent); background:var(--me); color:var(--me-ink); font-weight:600}
  .confirm .ok:hover:not(:disabled){background:var(--accent-d)}
  .confirm .no{border:1px solid var(--line); background:#fff; color:var(--muted)}
  .confirm .no:hover:not(:disabled){background:#fdfafc; border-color:#e3d7e8}
  /* 押した後は、どちらを選んだのかが後から読めるように 1 行残す */
  .confirm .done{font-size:12px; color:var(--accent-d); margin:0}

  /* ツール履歴バッジ。既存の .hint と同じカプセル語彙で、点線にして「補足情報」であることを示す。 */
  .tools:empty{display:none}
  .tools{display:flex; flex-direction:column; align-items:flex-start; gap:5px; margin-bottom:8px}
  .tool{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--muted); background:#fdfafc;
    border:1px dashed #e3d7e8; padding:4px 11px; border-radius:999px;
    animation:pop .22s ease-out;
  }

  /* markdown 本文。.bub の pre-wrap はブロック要素と二重に効くため md 側で解除する。 */
  .bub .md{white-space:normal}
  .bub .md > :first-child{margin-top:0}
  .bub .md > :last-child{margin-bottom:0}
  .bub .md p{margin:.5em 0}
  .bub .md h3,.bub .md h4,.bub .md h5{margin:.75em 0 .35em; line-height:1.5}
  .bub .md h3{font-size:15.5px}
  .bub .md h4{font-size:14.5px}
  .bub .md h5{font-size:13.5px; color:var(--muted)}
  .bub .md ul,.bub .md ol{margin:.5em 0; padding-left:1.35em}
  .bub .md li{margin:.22em 0}
  /* 入れ子は親項目の続きなので、上下の余白を詰めて 1 つの塊に見せる */
  .bub .md li > ul,.bub .md li > ol{margin:.2em 0 .1em}
  .bub .md li > ul{list-style:circle}
  .bub .md code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px;
                background:var(--accent-soft); border:1px solid #f7e2ea; border-radius:6px; padding:1px 5px}
  .bub .md pre{background:var(--accent-soft); border:1px solid #f7e2ea; border-radius:14px;
               padding:10px 13px; overflow-x:auto; margin:.6em 0}
  .bub .md pre code{background:none; border:none; padding:0; font-size:12.5px; line-height:1.6}
  .bub .md blockquote{margin:.6em 0; padding:.15em .9em; border-left:3px solid var(--accent); color:#7c7290}
  .bub .md hr{border:none; border-top:1px dashed var(--line); margin:.85em 0}
  .bub .md a{color:var(--accent-d)}
  .bub .md table{border-collapse:collapse; margin:.6em 0; font-size:13.5px; display:block; overflow-x:auto}
  .bub .md th,.bub .md td{border:1px solid var(--line); padding:5px 10px; text-align:left; white-space:nowrap}
  .bub .md th{background:var(--accent-soft); font-weight:600}
</style>
</head>
<body>
<div class="shell">
<aside id="sidebar">
  <div class="sbhead">会話 <span>新しい順</span></div>
  <div class="sblist" id="convlist"></div>
</aside>

<div class="app">
  <header>
    <div class="face">S</div>
    <div class="who">
      <b>STORE カスタマーサポート</b>
      <span><i class="dot"></i> オンライン</span>
    </div>
    <a class="adminlink" href="/admin" title="ナレッジベースなどの管理画面">管理画面</a>
    <button class="reset" id="reset" title="新しい会話を始めます">会話をリセット</button>
  </header>

  <div class="log" id="log"></div>

  <footer>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="ご用件をどうぞ… (Enter で送信 / Shift+Enter で改行)"></textarea>
      <button class="send" id="send" title="送信">➤</button>
    </div>
    <p class="tip" id="tip"></p>
  </footer>
</div>
</div>

<script>
const log   = document.getElementById('log');
const input = document.getElementById('input');
const send  = document.getElementById('send');
const tip   = document.getElementById('tip');

/* user_id は端末に固定(会話をまたいで同じ人だと分かるように)、
   conversation_id は done フレームで受け取って保存し、次のターンで送り返す。
   localStorage はプライベートウィンドウ等で例外を投げうるので必ず包む。 */
const UID_KEY = 'ec.user_id', CONV_KEY = 'ec.conversation_id';

function load(k){ try{ return localStorage.getItem(k); }catch{ return null; } }
function save(k, v){ try{ localStorage.setItem(k, v); }catch{} }
function drop(k){ try{ localStorage.removeItem(k); }catch{} }

let userId = load(UID_KEY) || ('web-' + Math.random().toString(36).slice(2, 10));
save(UID_KEY, userId);
let conversationId = Number(load(CONV_KEY)) || null;
let busy = false;
/* 満足度と一緒に送る「そのターンのユーザー発話」。モデルの回答ではない。
   ask() で更新し、満足度バーを作る時点の値をバーごとに閉じ込める(押すのが
   遅れて次のターンが始まっても、そのバーは自分のターンの質問を送る)。 */
let lastQuestion = '';

function updateTip(){
  tip.textContent = 'user_id: ' + userId + (conversationId ? '  /  conversation_id: ' + conversationId : '');
}

function setConversation(id){
  if (!id || id === conversationId) return;
  conversationId = id;
  save(CONV_KEY, String(id));
  updateTip();
}

function greet(fresh){
  log.innerHTML = '';
  addHint(!fresh && conversationId ? '前回の会話の続きです' : '新しい会話を始めました');
  const b = addRow('bot');
  b.textContent = 'STORE カスタマーサポートです。ご注文・配送・返品交換など、お気軽にどうぞ。';
}

function addHint(text){
  const d = document.createElement('div');
  d.className = 'hint'; d.textContent = text;
  log.appendChild(d); scroll();
}

/* ユーザー側は emoji を使わない。Windows の Segoe UI Emoji だと
   表情が硬く見えるうえ、環境によって字形が変わるため。 */
const ME_AVATAR = `<svg viewBox="0 0 32 32" aria-hidden="true">
  <circle cx="16" cy="12" r="5.4"/>
  <path d="M6.2 27c0-5.1 4.4-8.6 9.8-8.6S25.8 21.9 25.8 27z"/>
</svg>`;

function addRow(kind){
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const av = document.createElement('div');
  av.className = 'av';
  if (kind === 'me') av.innerHTML = ME_AVATAR;
  else av.textContent = 'S';
  const bub = document.createElement('div');
  bub.className = 'bub';
  row.append(av, bub);
  log.appendChild(row); scroll();
  return bub;
}

function scroll(){ log.scrollTop = log.scrollHeight; }

/* 到着した chunk を 1 文字ずつ吐き出して「打っている」感じにする。
   遅れが溜まったら早送りして、実際の応答から離れすぎないようにする。 */
function typer(el){
  let queue = '', text = '', done = false, timer = null;
  const caret = document.createElement('span');
  caret.className = 'caret';
  el.appendChild(caret);

  function tick(){
    if (queue.length){
      const step = queue.length > 60 ? 6 : queue.length > 20 ? 2 : 1;
      text += queue.slice(0, step);
      queue = queue.slice(step);
      el.innerHTML = renderMd(text);
      markCitations(el);
      // caret は最後のブロックの中に置く。直下に足すと改行して独りだけ次の行に出る。
      let last = el.lastElementChild;
      while (last && last.lastElementChild) last = last.lastElementChild;
      (last || el).appendChild(caret);
      scroll();
    } else if (done){
      clearInterval(timer); timer = null;
      caret.remove();
      return;
    }
  }
  timer = setInterval(tick, 14);

  return {
    push(s){ queue += s; },
    finish(){
      done = true;
      return new Promise(res => {
        const wait = setInterval(() => {
          if (!timer){ clearInterval(wait); res(); }
        }, 20);
      });
    },
    get text(){ return text + queue; }
  };
}

/* 依存なしの最小 markdown renderer。まず必ず escape してから、
   モデルが実際に出す範囲(見出し / 強調 / コード / 箇条書き / 表 / 引用 / 罫線 / リンク)だけ解釈する。
   ストリーミング中は未完成の記法が一瞬崩れて見えるが、次のフレームで直るので許容する。 */
function esc(t){
  return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
}

function inline(t){
  const code = [];
  let r = esc(t).replace(/`([^`\n]+)`/g, (_, c) => { code.push(c); return '\u0000' + (code.length - 1) + '\u0000'; });
  r = r
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return r.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + code[i] + '</code>');
}

/* リスト項目の判定。renderMd の中で 4 か所使うので 1 つの定義にまとめる
   (別々に書くと、片方だけ直したときに「箇条書きとして扱う行」と
   「段落を打ち切る行」がずれて、本文が黙って消える)。 */
const ITEM = /^\s*(?:[-*+]|\d+[.)])\s+/;
const kindOf = line => (/^\s*\d/.test(line) ? 'ol' : 'ul');

/* 字下げから入れ子を組み立てる。平らに並べると「見出しになっている項目」と
   「その内訳」が同じ深さに出て、どれがどれの説明なのか読めなくなる。
   同じ深さで記号の種類が変わったら別のリストとして切る。 */
function nestItems(rows, i, indent, tag){
  const nodes = [];
  while (i < rows.length){
    const r = rows[i];
    if (r.indent < indent) break;
    if (r.indent > indent){
      const [child, next] = nestItems(rows, i, r.indent, r.kind);
      if (!nodes.length) nodes.push({ text: '', children: [] });
      nodes[nodes.length - 1].children.push(child);
      i = next;
      continue;
    }
    if (r.kind !== tag) break;
    nodes.push({ text: r.text, children: [] });
    i++;
  }
  return [{ tag, nodes }, i];
}

function renderList(list){
  return '<' + list.tag + '>' + list.nodes.map(n =>
    // 項目の続き行は改行のまま残さず <br> にする(li の中の生の改行は詰まって見える)
    '<li>' + inline(n.text).replace(/\n/g, '<br>') +
    n.children.map(renderList).join('') + '</li>'
  ).join('') + '</' + list.tag + '>';
}

function renderMd(src){
  const L = src.split('\n');
  const out = [];
  const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
  let i = 0;

  while (i < L.length){
    const line = L[i];

    if (/^\s*```/.test(line)){                      // コードブロック(閉じ未着でも描画する)
      const buf = [];
      i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^\s*$/.test(line)){ i++; continue; }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    let m = /^\s*(#{1,6})\s+(.*)$/.exec(line);
    if (m){
      const h = Math.min(m[1].length, 3) + 2;        // # -> h3, ## -> h4, ###+ -> h5
      out.push('<h' + h + '>' + inline(m[2]) + '</h' + h + '>');
      i++; continue;
    }

    if (/^\s*\|/.test(line) && i + 1 < L.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i + 1])){
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') +
               '</tr></thead><tbody>' +
               rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
               '</tbody></table>');
      continue;
    }

    if (/^\s*>\s?/.test(line)){
      const buf = [];
      while (i < L.length && /^\s*>\s?/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + renderMd(buf.join('\n')) + '</blockquote>');
      continue;
    }

    if (ITEM.test(line)){
      const rows = [];
      for (;;){
        while (i < L.length && ITEM.test(L[i])){
          const mk = ITEM.exec(L[i]);
          const row = { indent: /^\s*/.exec(L[i])[0].length,
                        kind: kindOf(L[i]),
                        text: L[i].slice(mk[0].length).replace(/\s+$/, '') };
          i++;
          // 記号の無い字下げ行は、その項目の続き。ここで拾わないと項目と本文が
          // 切り離され、見出しだけの箇条書きと、宙に浮いた段落が交互に並ぶ
          // (実測: モデルは「- **送料について**」の次の行に説明を字下げして書く)。
          while (i < L.length && !ITEM.test(L[i]) && /^\s+\S/.test(L[i])){
            row.text += '\n' + L[i].trim();
            i++;
          }
          rows.push(row);
        }
        // 項目の間に空行が挟まっていても同じリストとして続ける。
        // 空行で切ると 1 項目ずつ別の <ol> になり、番号が毎回 1 に戻って
        // 「1. 1. 1.」と並ぶ(実測: モデルは太字の見出しを付けるとき項目の間を空ける)。
        let j = i;
        while (j < L.length && /^\s*$/.test(L[j])) j++;
        if (j < L.length && j > i && ITEM.test(L[j])){ i = j; continue; }
        break;
      }
      for (let k = 0; k < rows.length; ){
        const [list, next] = nestItems(rows, k, rows[k].indent, rows[k].kind);
        out.push(renderList(list));
        k = next > k ? next : k + 1;          // 進まなければ 1 つ進める(無限ループ避け)
      }
      continue;
    }

    const buf = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^\s*```/.test(L[i]) &&
           !ITEM.test(L[i]) && !/^\s*>/.test(L[i]) &&
           !/^\s*#{1,6}\s/.test(L[i]) && !/^\s*\|/.test(L[i])){
      buf.push(L[i++]);
    }
    out.push('<p>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}

/* 本文中の [1] [2] を押せる上付きに変える。
   renderMd は毎フレーム innerHTML を作り直すので、ここも毎フレーム掛け直す。
   テキストノードだけを見て回るのは、コードブロックや既存のタグを壊さないため。

   括弧も数字も全角のことがある(モデルは【1】とも書く。実測では半角と混ざる)。
   判定用の HAS_CITE を g 無しで別に持つのは、g 付きの正規表現に .test() を掛けると
   lastIndex が進み、次のテキストノードを途中から調べて引用を取りこぼすため。 */
const HAS_CITE = /[\[【［]([0-9０-９]{1,2})[\]】］]/;
const CITE_RE  = new RegExp(HAS_CITE.source, 'g');

// 上付きの表示と data-n は半角に揃える。出典の照合は citations の n(数値)と行う。
const halfDigits = t => t.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xfee0));

function markCitations(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      // code / pre の中の [1] は引用ではなくコードなので触らない
      if (node.parentElement.closest('code, pre, .cite')) return NodeFilter.FILTER_REJECT;
      return HAS_CITE.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    },
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  for (const node of targets){
    const span = document.createElement('span');
    span.innerHTML = esc(node.nodeValue).replace(
      CITE_RE, (_, n) => {
        const h = halfDigits(n);
        return `<sup class="cite" data-n="${h}">[${h}]</sup>`;
      }
    );
    node.replaceWith(...span.childNodes);
  }
}

/* 出典は吹き出しの下に開く。ポップアップにすると、スクロールや IME と競合しやすい。 */
function showSource(bub, items, n){
  bub.querySelectorAll('.src').forEach(e => e.remove());
  const item = (items || []).find(c => String(c.n) === String(n));
  const box = document.createElement('div');
  box.className = 'src';
  if (!item){
    box.innerHTML = `<div class="path">出典 [${esc(n)}] は見つかりませんでした</div>`;
  } else {
    box.innerHTML =
      `<div class="head"><div class="path">[${item.n}] ${esc(item.section_path || '')}</div>` +
      `<button class="close" title="閉じる">×</button></div>` +
      `<div class="q">${esc(item.question || '')}</div>` +
      `<div class="a">${esc(item.answer || '')}</div>`;
    box.querySelector('.close').addEventListener('click', () => box.remove());
  }
  bub.appendChild(box);
  box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* 満足度。1 回押したら固定する(押し直しを許すと、記録の意味が曖昧になる)。
   09 章から 👎 は backend へ送り、その質問を低信頼プールへ積む(👍 は保存されない)。
   **送信の成否で画面を変えない。** 押した時点で見た目を確定させ、通信が失敗しても
   黙って諦める。満足度はこの会話の本筋ではないので、ここでエラーを出すと、
   答えは届いているのに画面だけが失敗したように見える。 */
function addFeedbackBar(bub, question, cid){
  if (bub.querySelector('.fb')) return;
  const bar = document.createElement('div');
  bar.className = 'fb';
  bar.innerHTML = '<button data-v="up">👍</button><button data-v="down">👎</button>';
  const thanks = document.createElement('span');
  thanks.className = 'thanks';
  bar.appendChild(thanks);
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    bar.querySelectorAll('button').forEach(o => {
      o.disabled = true;
      o.classList.add(o === b ? 'active' : 'dim');
    });
    thanks.textContent = 'フィードバック済み';
    sendFeedback(cid, b.dataset.v, question);
  }));
  bub.appendChild(bar);
}

/* 満足度の送信。会話 ID か質問が分からないときは送らない(backend が 422 で弾く
   内容をわざわざ往復させない)。await しないのは、押した手応えを通信で待たせないため。 */
function sendFeedback(cid, rating, question){
  if (!cid || !String(question || '').trim()) return;
  fetch('/api/feedback', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ conversation_id: cid, rating, question })
  }).catch(() => {});          // 失敗しても会話の本筋は壊さない
}

/* 選択肢ボタン。backend は苦情のとき「有人対応 / チケット作成」を提案するだけで、
   何も実行しない。動くのはここでユーザーが押したときだけ(spec §6)。
   返ってきた items にあるものだけを描き、2 つは互いに独立して押せる。 */
function renderActions(bub, items){
  if (bub.querySelector('.acts')) return;
  const bar = document.createElement('div');
  bar.className = 'acts';

  for (const a of items || []){
    if (a.type === 'transfer_human'){
      const b = addActionButton(bar, '有人対応');
      // 本章では実際の有人窓口には繋がない。画面上の切り替えだけ(spec §6.2)
      b.addEventListener('click', () => {
        b.disabled = true;
        addHint('有人対応へ切り替えました');
        addRow('bot').textContent =
          'こんにちは。カスタマーサポート担当です。どのようなご用件でしょうか。';
      });
    } else if (a.type === 'create_ticket'){
      const b = addActionButton(bar, 'チケット作成');
      // a.draft は backend 側の「提案」。フォームには入れない(spec §6.3)
      b.addEventListener('click', () => openTicketForm(b));
    } else if (a.type === 'refund_form'){
      const b = addActionButton(bar, '返金申請を送信');
      // こちらは draft を入れる。どの注文の返金かは backend が特定済みで(選んだのは
      // ユーザー自身)、フォームで選び直させる意味が無い。チケット作成の draft を
      // 入れないのはモデルの言い換えが本人の申告として残るからで、事情が違う。
      b.addEventListener('click', () => openRefundForm(b, ((a.draft || {}).order_id) || ''));
    }
  }

  if (!bar.children.length) return;
  bub.appendChild(bar); scroll();
}

function addActionButton(bar, text){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'act'; b.textContent = text;
  bar.appendChild(b);
  return b;
}

/* 金額は数値で届く。桁区切りだけ入れて円で出す。
   数値以外が来たらそのまま文字列として出す(勝手に 0 円へ倒さない)。 */
function yen(v){
  if (typeof v === 'number' && isFinite(v)) return '¥' + v.toLocaleString('ja-JP');
  return v == null ? '' : String(v);
}

/* 注文の選択カード。注文番号が分からないとき、backend は推測せずに interrupt で
   止まり、その人の注文一覧を送ってくる(spec §12)。ここから選ばれた 1 件を
   /api/actions/resume へ返すと、止まっていた turn がその続きから走る。 */
function renderOrders(bub, orders){
  const list = (orders || []).filter(o => o && o.order_id !== undefined && o.order_id !== null && o.order_id !== '');
  if (!list.length){
    // 一覧が空、または壊れて届いた。カードを出せないので番号の入力をお願いする
    addHint('ご注文の一覧を取得できませんでした。注文番号をご入力ください');
    return;
  }

  const box = document.createElement('div');
  box.className = 'orders';
  for (const o of list){
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'order-card';
    c.dataset.order = String(o.order_id);
    // product / status は DB とモデルの側から来る文字列。必ず esc を通す
    c.innerHTML =
      `<span class="no">注文番号 ${esc(String(o.order_id))}</span>` +
      `<span class="pd">${esc(o.product == null ? '' : String(o.product))}</span>` +
      `<span class="meta"><span class="st">${esc(o.status == null ? '' : String(o.status))}</span>` +
      `<span class="amt">${esc(yen(o.amount))}</span></span>`;
    c.addEventListener('click', () => pickOrder(box, c));
    box.appendChild(c);
  }
  bub.appendChild(box); scroll();
}

/* カードを押したら再開する。押した瞬間に**一覧ごと**無効にする。
   1 つの中断は 1 回しか再開できないので、2 枚目を押せる状態で残すと
   「選んだのに別の注文の話が返ってくる」ように見える。 */
async function pickOrder(box, card){
  if (busy || box.dataset.picked) return;
  box.dataset.picked = '1';
  box.querySelectorAll('.order-card').forEach(b => { b.disabled = true; });
  card.classList.add('picked');

  if (!conversationId){
    addRow('err').textContent = '会話を特定できませんでした。もう一度お試しください';
    return;
  }
  setBusy(true);
  // 読み取りは発話のときと同じ。フレームの形が同じなので分ける理由が無い
  try { await streamTurn('/api/actions/resume',
                         { conversation_id: conversationId, order_id: card.dataset.order }); }
  finally { setBusy(false); }
}

/* チケット内容の確認カード。08 章。create_ticket は唯一の書き込み系ツールで、
   engine の権限闸が「確認済みでなければ実行しない」を守っている。その確認を
   取るのがこのカードで、押されるまで tickets には 1 行も入らない。
   注文カードと同じ interrupt → resume の仕組みだが、返す値が真偽値である点だけが違う。 */
function renderTicketConfirm(bub, preview, cid){
  const p = preview || {};
  const box = document.createElement('div');
  box.className = 'confirm';
  // ticket_type は英語識別子で来る。表示するのは backend が付けた日本語ラベルで、
  // 画面側に対応表を持たない(表示名の出所を 2 つにしない)
  const kind = p.ticket_type_label || p.ticket_type || '';
  box.innerHTML =
    '<h4>チケット内容の確認</h4>' +
    '<dl>' +
      '<dt>種別</dt><dd>' + esc(String(kind)) + '</dd>' +
      '<dt>問題内容</dt><dd>' + esc(String(p.description == null ? '' : p.description)) + '</dd>' +
    '</dl>' +
    '<div class="btns">' +
      '<button type="button" class="ok">送信を確認</button>' +
      '<button type="button" class="no">キャンセル</button>' +
    '</div>';

  const btns = box.querySelectorAll('button');
  btns[0].addEventListener('click', () => decideTicket(box, true, cid));
  btns[1].addEventListener('click', () => decideTicket(box, false, cid));
  bub.appendChild(box); scroll();
}

/* 押したら再開する。注文カードと同じで、押した瞬間に両方のボタンを無効にする。
   1 つの中断は 1 回しか再開できないので、もう片方を押せる状態で残すと
   「キャンセルしたのにチケットが立つ」ように見える。 */
async function decideTicket(box, confirmed, cid){
  if (busy || box.dataset.done) return;
  box.dataset.done = '1';
  box.querySelectorAll('button').forEach(b => { b.disabled = true; });

  // 何を選んだのかをカードに残す。次の吹き出しだけでは、後から読み返したときに
  // 「送ったのか取り消したのか」がカード側から読み取れない
  const note = document.createElement('p');
  note.className = 'done';
  note.textContent = confirmed ? '送信を確認しました' : 'キャンセルしました';
  box.appendChild(note);

  const id = cid || conversationId;
  if (!id){
    addRow('err').textContent = '会話を特定できませんでした。もう一度お試しください';
    return;
  }
  setBusy(true);
  try { await streamTurn('/api/actions/resume',
                         { conversation_id: id, confirmed: confirmed }); }
  finally { setBusy(false); }
}

/* 返金理由。app/schemas/actions.py の CreateRefundRequest.reason と同じ 5 つで、
   自由記述にしない(後で集計と振り分けに使う)。ここが増減したら backend も直すこと。 */
const REFUND_REASONS = ['7日以内の自己都合返品', '品質不良', '誤配送', '不要になった', 'その他'];

/* 返金申請フォーム。作りはチケット作成フォームと同じで、閉じ方
   (キャンセル / 背景 / Esc)はどれも申請を作らず、ボタンは押せる状態へ戻す。 */
function openRefundForm(btn, orderId){
  btn.disabled = true;                       // 開いている間は二重に開かせない

  const mask = document.createElement('div');
  mask.className = 'mask';
  // 注文番号は入れて読み取り専用にする。理由は既定の選択を置かない
  // (先頭の選択肢が黙って送られると、選んでいない理由が tickets に残る)
  mask.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="返金申請">
      <h3>返金申請</h3>
      <p class="lead">ご返金の理由をお選びください。担当者が内容を確認いたします。</p>
      <label class="field">
        <span class="cap">注文番号</span>
        <input class="f-order" type="text" readonly value="${esc(String(orderId))}">
      </label>
      <label class="field">
        <span class="cap">返金理由<i>必須</i></span>
        <select class="f-reason">
          <option value="">選択してください</option>
          ${REFUND_REASONS.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}
        </select>
      </label>
      <p class="warn"></p>
      <div class="btns">
        <button type="button" class="ghost">キャンセル</button>
        <button type="button" class="go">送信する</button>
      </div>
    </div>`;
  document.body.appendChild(mask);

  const sel  = mask.querySelector('.f-reason');
  const warn = mask.querySelector('.warn');
  const go   = mask.querySelector('.go');

  const close = (created) => {
    document.removeEventListener('keydown', onKey);
    mask.remove();
    btn.disabled = created;                  // 送れたときだけ押せないままにする
    if (!busy) input.focus();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(false); };

  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', e => { if (e.target === mask) close(false); });
  mask.querySelector('.ghost').addEventListener('click', () => close(false));

  go.addEventListener('click', async () => {
    // 必須チェックは送信前にここで行う。backend も 422 で弾くが、往復させない
    if (!sel.value){ warn.textContent = '返金理由を選択してください'; sel.focus(); return; }
    if (!String(orderId).trim()){ warn.textContent = '注文番号を特定できませんでした。もう一度お試しください'; return; }
    if (!conversationId){ warn.textContent = '会話を特定できませんでした。もう一度お試しください'; return; }

    warn.textContent = '';
    go.disabled = true; go.textContent = '送信中…';
    const restore = () => { go.disabled = false; go.textContent = '送信する'; };

    try{
      const res = await fetch('/api/actions/create-refund', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          conversation_id: conversationId,
          order_id: String(orderId),
          reason: sel.value,
        })
      });
      if (!res.ok){
        // 選び直せるようにフォームは開いたままにする
        warn.textContent = res.status === 422
          ? '入力内容をご確認ください'
          : '返金申請を受け付けられませんでした。しばらくしてからもう一度お試しください';
        restore();
        return;
      }
      const data = await res.json();
      close(true);
      // ticket_no は DB 由来。textContent なのでそのまま入れてよい
      addHint('返金申請を送信しました ' + data.ticket_no);
    } catch {
      warn.textContent = 'サーバーに接続できませんでした';
      restore();
    }
  });

  sel.focus();
}

/* チケット作成フォーム。種別も内容も、その場でユーザーに入力してもらう。
   backend の draft を初期値に入れないのは、モデルの言い換えが本人の申告として
   tickets に残ってしまうため(spec §6.3)。
   閉じ方(キャンセル / 背景 / Esc)はどれもチケットを作らず、ボタンは押せる状態へ戻す。 */
function openTicketForm(btn){
  btn.disabled = true;                       // 開いている間は二重に開かせない

  const mask = document.createElement('div');
  mask.className = 'mask';
  // 種別は表示だけ日本語で、value は DB の ENUM と同じ英語の識別子を送る
  mask.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="チケット作成">
      <h3>チケット作成</h3>
      <p class="lead">担当者がお調べいたします。種別とご用件をご記入ください。</p>
      <label class="field">
        <span class="cap">お問い合わせ種別<i>必須</i></span>
        <select class="f-type">
          <option value="">選択してください</option>
          <option value="after_sales">アフターサービス</option>
          <option value="complaint">苦情</option>
          <option value="inquiry">問い合わせ</option>
        </select>
      </label>
      <label class="field">
        <span class="cap">お問い合わせ内容<i>必須</i></span>
        <textarea class="f-desc" rows="4" placeholder="ご状況をご記入ください"></textarea>
      </label>
      <p class="warn"></p>
      <div class="btns">
        <button type="button" class="ghost">キャンセル</button>
        <button type="button" class="go">作成する</button>
      </div>
    </div>`;
  document.body.appendChild(mask);

  const sel  = mask.querySelector('.f-type');
  const desc = mask.querySelector('.f-desc');
  const warn = mask.querySelector('.warn');
  const go   = mask.querySelector('.go');

  const close = (created) => {
    document.removeEventListener('keydown', onKey);
    mask.remove();
    btn.disabled = created;                  // 作れたときだけ押せないままにする
    if (!busy) input.focus();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(false); };

  document.addEventListener('keydown', onKey);
  mask.addEventListener('click', e => { if (e.target === mask) close(false); });
  mask.querySelector('.ghost').addEventListener('click', () => close(false));

  go.addEventListener('click', async () => {
    // 必須チェックは送信前にここで行う。backend も 422 で弾くが、往復させない
    if (!sel.value){ warn.textContent = 'お問い合わせ種別を選択してください'; sel.focus(); return; }
    if (!desc.value.trim()){ warn.textContent = 'お問い合わせ内容をご記入ください'; desc.focus(); return; }
    if (!conversationId){ warn.textContent = '会話を特定できませんでした。もう一度お試しください'; return; }

    warn.textContent = '';
    go.disabled = true; go.textContent = '送信中…';
    const restore = () => { go.disabled = false; go.textContent = '作成する'; };

    try{
      const res = await fetch('/api/actions/create-ticket', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          conversation_id: conversationId,
          description: desc.value.trim(),
          ticket_type: sel.value,
        })
      });
      if (!res.ok){
        // 入力し直せるようにフォームは開いたままにする(閉じると書いた内容が消える)
        warn.textContent = res.status === 422
          ? '入力内容をご確認ください'
          : 'チケットを作成できませんでした。しばらくしてからもう一度お試しください';
        restore();
        return;
      }
      const data = await res.json();
      close(true);
      // ticket_no は DB 由来。textContent なのでそのまま入れてよい
      addHint('チケットを作成しました ' + data.ticket_no);
    } catch {
      warn.textContent = 'サーバーに接続できませんでした';
      restore();
    }
  });

  sel.focus();
}

function setBusy(v){
  busy = v;
  send.disabled = v;
  input.disabled = v;
  if (!v) input.focus();
}

/* SSE の読み取り。入口は 2 つあるが(発話の /api/chat と、注文を選んだ後の
   /api/actions/resume)、**流れるフレームは同じ**なので読み取りも 1 つにする。
   違うのは URL と body だけ。2 つに割ると、新しいフレームを足したときに片方だけ
   直す事故が起きる(app/api/sse.py が backend 側で同じことをしている)。 */
async function streamTurn(url, body){
  /* bot 行は最初から出しておき、本文には 3 点リーダーを入れておく。
     ツールバッジが付いてから最初の delta が届くまでの間も、ここが空だと固まって見える。 */
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="av">S</div><div class="bub">' +
                  '<div class="tools"></div>' +
                  '<div class="md"><div class="think"><i></i><i></i><i></i></div></div>' +
                  '</div>';
  log.appendChild(row); scroll();

  const tools = row.querySelector('.tools');
  const md    = row.querySelector('.md');
  const bub   = row.querySelector('.bub');

  let type = null, started = false, badged = false, closed = false;
  let citations = [], actions = [], interrupt = null;

  // 印は毎フレーム作り直されるので、個々の sup ではなく吹き出しに 1 つだけ委譲する
  bub.addEventListener('click', (e) => {
    const c = e.target.closest('.cite');
    if (c) showSource(bub, citations, c.dataset.n);
  });

  const start = () => {
    if (started) return;
    started = true;
    md.innerHTML = '';
    type = typer(md);
  };

  const addTool = (name) => {
    badged = true;
    const t = document.createElement('div');
    t.className = 'tool';
    t.textContent = '🔧 ' + name + ' を呼び出しました';
    tools.appendChild(t); scroll();
  };

  // 本文が空のまま終わる場合の後始末。バッジだけは残す価値があるので行ごとは消さない。
  const settle = () => {
    if (closed) return;
    closed = true;
    if (!started){
      if (badged) md.remove();
      else row.remove();
    }
  };

  const fail = async (text) => {
    if (started) await type.finish();
    settle();
    addRow('err').textContent = text;
  };

  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });

    if (!res.ok){
      await fail(`リクエストが受け付けられませんでした (HTTP ${res.status})`);
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    for(;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });

      let i;
      while ((i = buf.indexOf('\n\n')) !== -1){
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);

        let ev = 'message', data = '';
        for (const line of frame.split('\n')){
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data = line.slice(5).trim();
        }
        if (!data) continue;

        if (ev === 'error'){
          let msg = 'エラーが発生しました';
          try { msg = JSON.parse(data).message || msg; } catch {}
          await fail('⚠ ' + msg);
          continue;   // error の後に [DONE] は来ない。ストリーム終了まで読み切る
        }
        if (data === '[DONE]') continue;

        let obj;
        try { obj = JSON.parse(data); } catch { continue; }

        if (obj.event === 'tool'){ addTool(obj.name); continue; }
        if (obj.event === 'citations'){ citations = obj.items || []; continue; }
        // actions は本文の後・done の前に 1 回だけ来る。ボタンはストリームが
        // 終わってから描く(打鍵表示の途中に出すと、本文の下で位置が動く)
        if (obj.event === 'actions'){ actions = obj.items || []; continue; }
        // 選択待ちで止まった。この後 done は来ないので、会話 ID はここで受け取る。
        // 初回ターンで止まると、他に /api/actions/resume を叩く手立てが無い
        if (obj.event === 'interrupt'){
          interrupt = obj;
          setConversation(obj.conversation_id);
          continue;
        }
        if (obj.event === 'done'){ setConversation(obj.conversation_id); continue; }
        if (obj.delta){ start(); type.push(obj.delta); }
      }
    }

    if (started) await type.finish();

    /* 選択待ちで止まった場合。turn は完結していないので、選択肢も満足度も出さない。
       行は settle で消さずに残す。ここが注文カードの置き場所になる
       (本文も tool バッジも無いまま止まるので、消すと出す先が無くなる)。 */
    if (interrupt){
      closed = true;
      // 中断の種類で出し分ける。kind が増えたらここに足す(既定は注文の選択)
      if (interrupt.kind === 'confirm_ticket'){
        if (!started) md.textContent = '以下の内容でチケットを作成します。よろしいでしょうか。';
        renderTicketConfirm(bub, interrupt.preview, interrupt.conversation_id);
      } else {
        if (!started) md.textContent = 'どのご注文についてでしょうか。以下からお選びください。';
        renderOrders(bub, interrupt.orders);
      }
      return;
    }

    settle();
    // 選択肢は満足度より先に出す。押してほしいのはこちらなので
    if (bub.isConnected) renderActions(bub, actions);
    // answer が出た場合だけ満足度を出す。拒否やエラーの吹き出しには付けない
    if (started) addFeedbackBar(bub, lastQuestion, conversationId);

  } catch (err){
    await fail('⚠ サーバーに接続できませんでした。サービスが起動しているか確認してください。');
  }
}

/* ── 会話の切り替え欄 ─────────────────────────────────────────────
   長い会話で文脈が保たれていることを人が確かめるには、会話を行き来できる必要が
   ある(07 章の受け入れ検証)。**本筋のチャットを壊さないことが条件**なので、
   一覧の取得に失敗しても黙って前の表示のままにする(エラーの吹き出しも出さない)。
   読み取り専用で、ここから会話を消したり状態を変えたりはできない。 */
const convList = document.getElementById('convlist');

async function loadConversations(){
  try{
    const res = await fetch('/api/conversations?user_id=' + encodeURIComponent(userId));
    if (!res.ok) return;                       // 黙って前の一覧を残す
    renderConversations((await res.json()).items || []);
  }catch{}                                     // サービスが落ちていてもチャットは続く
}

/* 「09/08 14:20」。年は出さない(一覧の 1 行に収める) */
function when(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderConversations(items){
  convList.innerHTML = '';
  if (!items.length){
    const d = document.createElement('div');
    d.className = 'sbempty';
    d.textContent = 'まだ会話がありません';
    convList.appendChild(d);
    return;
  }
  for (const it of items){
    const b = document.createElement('button');
    b.className = 'conv' + (it.id === conversationId ? ' on' : '');

    const top = document.createElement('div');
    top.className = 'top';
    const no = document.createElement('span');
    no.textContent = '#' + it.id;
    top.appendChild(no);
    // 要約済みかどうかは、この章で確かめたいことそのものなので一覧に出す
    if (it.has_summary){
      const s = document.createElement('span');
      s.className = 'sum';
      s.textContent = '要約済み';
      top.appendChild(s);
    }

    const pv = document.createElement('div');
    pv.className = 'pv' + (it.preview ? '' : ' none');
    pv.textContent = it.preview || 'まだ発話がありません';

    const foot = document.createElement('div');
    foot.className = 'foot';
    // status は backend が日本語ラベルで返す(画面側に対応表を持たせない)
    foot.textContent = it.status + ' · ' + when(it.updated_at);

    b.append(top, pv, foot);
    b.addEventListener('click', () => switchConversation(it.id));
    convList.appendChild(b);
  }
}

function renderHistoryRow(m){
  if (m.role === 'user'){
    // ユーザーの発話は素のテキスト。markdown として解釈すると、打った記号が
    // 勝手に書式になって「自分が何を送ったか」が読めなくなる
    addRow('me').textContent = m.content;
    return;
  }
  const bub = addRow('bot');
  const md = document.createElement('div');
  md.className = 'md';
  md.innerHTML = renderMd(m.content);
  bub.appendChild(md);
}

async function switchConversation(cid){
  if (busy) return;
  setBusy(true);
  try{
    const res = await fetch('/api/conversations/' + cid + '/messages');
    if (!res.ok){ addHint('この会話の履歴を読み込めませんでした'); return; }
    const items = (await res.json()).items || [];
    // 読めたときだけ切り替える。先に切り替えると、読めなかった会話へ次の発話が飛ぶ
    setConversation(cid);
    log.innerHTML = '';
    addHint('会話 #' + cid + ' を開きました');
    for (const m of items) renderHistoryRow(m);
    if (!items.length) addHint('この会話にはまだ発話がありません');
    scroll();
  }catch{
    addHint('この会話の履歴を読み込めませんでした');
  }finally{
    setBusy(false);
    loadConversations();   // 選択中の印を付け直す
  }
}

async function ask(message){
  addRow('me').textContent = message;
  lastQuestion = message;      // 満足度はこの発話に付く(注文の選択で再開しても変わらない)
  await streamTurn('/api/chat',
                   { user_id: userId, message, conversation_id: conversationId });
}

async function submit(){
  const msg = input.value.trim();
  if (!msg || busy) return;
  input.value = ''; autosize();
  setBusy(true);
  // 初回のターンで会話が採番されるので、送り終わってから一覧を取り直す
  try { await ask(msg); } finally { setBusy(false); loadConversations(); }
}

function autosize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

send.addEventListener('click', submit);
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); }
});
document.getElementById('reset').addEventListener('click', () => {
  if (busy) return;
  conversationId = null;   // user_id は据え置き。次のターンで新しい会話が作られる
  drop(CONV_KEY);
  updateTip();
  greet(true);
  loadConversations();     // 選択中の印を外す(新しい会話はまだ採番されていない)
  input.focus();
});

updateTip();
greet(false);
loadConversations();
input.focus();
</script>
</body>
</html>
